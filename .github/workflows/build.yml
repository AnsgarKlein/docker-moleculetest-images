---
name: Build container images

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * 5"

permissions:
  contents: read

jobs:
  discover-images:
    name: Discover buildable images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.list-images.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3"

      - name: Discover images
        id: list-images
        run: |
          images=$(python build.py --list-images)
          echo "$images"
          {
            echo 'images<<EOF'
            echo "$images"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build-image:
    name: Build ${{ matrix.image_dir }}
    needs: discover-images
    runs-on: ubuntu-latest
    environment: >-
      ${{ (github.ref_type == 'branch' &&
           github.ref_name == github.event.repository.default_branch) &&
          'default-branch' || 'default' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-images.outputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3"

      - name: Build container image
        env:
          IMAGE: ${{ matrix.image_dir }}
        timeout-minutes: 30
        run: python build.py "$IMAGE"

      - name: Log in to Docker Hub
        if: >-
          github.ref_type == 'branch' &&
          github.ref_name == github.event.repository.default_branch
        uses: docker/login-action@v4
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Push container image
        if: >-
          github.ref_type == 'branch' &&
          github.ref_name == github.event.repository.default_branch
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
        timeout-minutes: 30
        run: |
          local_image="$IMAGE_NAME:latest"
          remote_image="ansgarklein/$local_image"
          echo "Local image: $local_image"
          echo "Remote image: $remote_image"
          docker tag "$local_image" "$remote_image"
          docker push "$remote_image"
